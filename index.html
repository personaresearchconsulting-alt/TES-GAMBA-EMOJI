<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ujian - Persona Research & Consulting</title>
    <style>
        :root { --navy: #0b2340; --gold: #d4a017; --white: #ffffff; }
        body { font-family: 'Inter', sans-serif; background: #e2e8f0; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: var(--white); padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 6px solid var(--navy); }
        .logo-area h1 { font-size: 20px; color: var(--navy); margin-bottom: 5px; }
        .logo-area p { font-size: 12px; color: #64748b; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 16px; }
        .btn-login { width: 100%; background: var(--navy); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #153a66; }
        .expired-msg { color: #c0392b; font-weight: bold; display: none; padding: 20px; }
        #menuArea { display: none; }
        .menu-item { display: block; background: #f1f5f9; padding: 15px; margin: 10px 0; border-radius: 8px; text-decoration: none; color: var(--navy); font-weight: 600; border: 1px solid #cbd5e1; transition: 0.2s; text-align: left; }
        .menu-item:hover { background: var(--gold); color: white; border-color: var(--gold); }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <h1>PORTAL SIMULASI POLRI</h1>
        <p>Persona Research & Consulting</p>
    </div>

    <div id="loginSection">
        <input type="text" id="passInput" placeholder="Masukkan Password Akses..." autocomplete="off">
        <button class="btn-login" onclick="checkAccess()">MASUK SISTEM</button>
        <p id="errorMsg" style="color: #c0392b; font-size: 13px; margin-top: 15px; display: none; font-weight: bold;"></p>
    </div>

    <div id="menuArea">
        <p style="font-size: 14px; color: #64748b; margin-bottom: 15px;">Pilih Menu Ujian:</p>
        <a href="mono_14_fix.html" class="menu-item">1. TES KECERMATAN EKSPRESI</a>
        <p style="font-size: 11px; margin-top: 25px; color: #94a3b8; border-top: 1px solid #eee; pt-10">Akses Berlaku s/d: <span id="expiryDateLabel"></span></p>
    </div>

    <div id="expiredSection" class="expired-msg">
        ⚠️ MASA BERLAKU AKSES TELAH HABIS.<br>
        <span style="font-size: 12px; font-weight: normal; color: #64748b; margin-top: 10px; display: block;">Silakan hubungi Admin Usahaki untuk perpanjangan.</span>
    </div>
</div>

<script>
    const CONFIG = {
        password: "persona02",
        expiryDate: "2026-05-06" // Berlaku 7 hari ke depan
    };

    document.getElementById('expiryDateLabel').innerText = CONFIG.expiryDate;

    function checkAccess() {
        const input = document.getElementById('passInput').value.trim().toLowerCase();
        const errorMsg = document.getElementById('errorMsg');
        
        // Ambil waktu saat ini tanpa jam (hanya tanggal) untuk akurasi hari
        const now = new Date();
        const expiry = new Date(CONFIG.expiryDate);

        // 1. Cek Masa Berlaku
        if (now > expiry) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('expiredSection').style.display = 'block';
            return;
        }

        // 2. Cek Password (Anti-Salah Ketik)
        if (input === CONFIG.password) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('menuArea').style.display = 'block';
        } else {
            errorMsg.style.display = 'block';
            errorMsg.innerText = "Password salah! Pastikan ketikan Anda benar.";
        }
    }

    document.getElementById('passInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkAccess();
    });
</script>

</body>
</html>
