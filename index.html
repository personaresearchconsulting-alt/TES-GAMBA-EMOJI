<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CBT Tes Koran - Persona Research</title>
<script src="https://openfpcdn.io/fingerprintjs/v4"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--primary:#1e88e5;--danger:#d32f2f;--muted:#6b7280}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg)}
header{background:linear-gradient(135deg,#1e88e5,#1565c0);color:#fff;padding:16px;text-align:center;position:relative}
.container{max-width:1100px;margin:20px auto;padding:12px}
.card{background:var(--card);border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.08);padding:20px}
/* Overlay Login & Lisensi */
#license-overlay {position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.98);z-index:9999;display:flex;align-items:center;justify-content:center;text-align:center}
.login-box {background:#fff;padding:30px;border-radius:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1);max-width:380px;width:90%}
input {width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button {width:100%;padding:12px;background:#1e88e5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.table{display:grid;grid-template-columns:1fr 360px 1fr;gap:12px;margin-top:16px;align-items:flex-start}
.col{border:1px solid #e5e7eb;background:#fafafa;height:500px;overflow:hidden;position:relative}
.cell{padding:10px;border-bottom:1px solid #eee;text-align:center;font-size:20px;font-weight:bold}
.cell.focus{background: #e3f2fd; outline: 3px solid #1e88e5;}
#keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad-btn{padding:20px;background:#1e88e5;color:#fff;border-radius:8px;font-size:20px;border:none}
.result-page{display:none}
</style>
</head>
<body>

<div id="license-overlay">
    <div class="login-box">
        <img src="https://cdn-icons-png.flaticon.com/512/2583/2583151.png" width="80" alt="Logo">
        <h3>Aktivasi Lisensi CBT</h3>
        <p id="status-msg" style="font-size:13px; color:#666">Masukkan Key untuk akses 7 hari (Maks 3 Device)</p>
        <input id="license-input" type="text" placeholder="Masukkan License Key">
        <button onclick="validateLicense()">Aktivasi Sekarang</button>
        <div id="error-log" style="color:red; margin-top:10px; font-size:13px; display:none"></div>
    </div>
</div>

<div id="app" style="display:none">
    <header>
        <h2>CBT Tes Sikap Kerja (Tes Koran)</h2>
        <div id="meta-info" style="font-size:12px">Lisensi Aktif s/d: <span id="exp-date"></span></div>
    </header>
    <div class="container">
        <div class="card">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px">
                <b>Kolom: <span id="colNum">1</span>/20</b>
                <b style="color:red">Sisa Waktu: <span id="timer">03:00</span></b>
            </div>
            <div class="table">
                <div id="colLeft" class="col"></div>
                <div class="keypad-slot">
                    <div id="keypad">
                        <button class="keypad-btn" onclick="pressKey(1)">1</button>
                        <button class="keypad-btn" onclick="pressKey(2)">2</button>
                        <button class="keypad-btn" onclick="pressKey(3)">3</button>
                        <button class="keypad-btn" onclick="pressKey(4)">4</button>
                        <button class="keypad-btn" onclick="pressKey(5)">5</button>
                        <button class="keypad-btn" onclick="pressKey(6)">6</button>
                        <button class="keypad-btn" onclick="pressKey(7)">7</button>
                        <button class="keypad-btn" onclick="pressKey(8)">8</button>
                        <button class="keypad-btn" onclick="pressKey(9)">9</button>
                        <div style="grid-column:2"><button class="keypad-btn" onclick="pressKey(0)">0</button></div>
                    </div>
                </div>
                <div id="colRight" class="col"></div>
            </div>
        </div>
    </div>
</div>

<script>
// --- CONFIG LISENSI ---
const VALID_KEYS = ["PRO-TEST-2026", "PERSONA-7D"]; // Daftar Key yang valid
const MAX_DEVICES = 3;
const DURATION_DAYS = 7;

let deviceID = "";

// 1. Inisialisasi Fingerprint (Device ID)
async function initAuth() {
    const fp = await FingerprintJS.load();
    const result = await fp.get();
    deviceID = result.visitorId;
    checkAccess();
}

// 2. Cek Akses di LocalStorage
function checkAccess() {
    const session = JSON.parse(localStorage.getItem('cbt_session'));
    
    if (session) {
        const now = new Date().getTime();
        // Cek Expired
        if (now > session.expiry) {
            showError("Lisensi telah kadaluarsa (7 hari habis).");
            return;
        }
        // Cek Perangkat (Simulasi limit 3 device via LocalStorage)
        // Note: Pada sistem statis, limit device murni mengunci pada browser yang pernah login.
        document.getElementById('license-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('exp-date').innerText = new Date(session.expiry).toLocaleDateString('id-ID');
        startTest();
    }
}

// 3. Validasi Lisensi Baru
function validateLicense() {
    const input = document.getElementById('license-input').value.trim();
    const err = document.getElementById('error-log');

    if (VALID_KEYS.includes(input)) {
        const expiryTime = new Date().getTime() + (DURATION_DAYS * 24 * 60 * 60 * 1000);
        const sessionData = {
            key: input,
            activatedAt: new Date().getTime(),
            expiry: expiryTime,
            did: deviceID
        };
        
        localStorage.setItem('cbt_session', JSON.stringify(sessionData));
        location.reload();
    } else {
        err.innerText = "Key Tidak Valid!";
        err.style.display = 'block';
    }
}

function showError(msg) {
    document.getElementById('status-msg').innerText = msg;
    document.getElementById('status-msg').style.color = "red";
}

// --- LOGIKA TES KORAN (SIMPLIFIED) ---
let currentCol = 0;
let timeLeft = 180;
let data = [];

function startTest() {
    // Generate Data
    for(let i=0; i<20; i++) {
        let col = [];
        for(let j=0; j<150; j++) col.push(Math.floor(Math.random() * 9) + 1);
        data.push(col);
    }
    renderGame();
    setInterval(updateTimer, 1000);
}

function renderGame() {
    const container = document.getElementById('colLeft');
    container.innerHTML = '';
    const inner = document.createElement('div');
    inner.id = "inner-scroll";
    
    data[currentCol].forEach((num, i) => {
        if(i < data[currentCol].length - 1) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = `cell-${i}`;
            cell.innerHTML = `<div>${num}</div><div>${data[currentCol][i+1]}</div>`;
            inner.appendChild(cell);
        }
    });
    container.appendChild(inner);
    document.getElementById(`cell-0`).classList.add('focus');
}

let currentRow = 0;
function pressKey(val) {
    const target = (data[currentCol][currentRow] + data[currentCol][currentRow+1]) % 10;
    // Logika benar/salah bisa ditambahkan di sini
    
    document.getElementById(`cell-${currentRow}`).classList.remove('focus');
    currentRow++;
    const next = document.getElementById(`cell-${currentRow}`);
    if(next) {
        next.classList.add('focus');
        next.scrollIntoView({block: "center"});
    }
}

function updateTimer() {
    if(timeLeft <= 0) {
        if(currentCol < 19) {
            currentCol++;
            currentRow = 0;
            timeLeft = 180;
            renderGame();
        } else {
            alert("Tes Selesai!");
            location.reload();
        }
    }
    timeLeft--;
    const min = Math.floor(timeLeft/60);
    const sec = timeLeft%60;
    document.getElementById('timer').innerText = `${min}:${sec < 10 ? '0'+sec : sec}`;
    document.getElementById('colNum').innerText = currentCol + 1;
}

window.onload = initAuth;
</script>
</body>
</html>
